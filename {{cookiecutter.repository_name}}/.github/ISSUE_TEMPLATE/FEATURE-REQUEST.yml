name: "💡 Feature Request"
description: Suggest a new tool, setting or capability for the {{ cookiecutter.extension_name }} extension.
title: "💡 [REQUEST] - <title>"
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: What you would like the extension to do.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: "Use case"
      description: What you, or the LLM, would do with it.
    validations:
      required: true
