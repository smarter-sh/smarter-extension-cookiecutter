# Run the pre-commit hooks on every file, on each push to main and each pull request: the same
# lint and format standard that `make lint` applies locally. commitlint runs only locally, on
# commit messages.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: pip install -r requirements/local.txt

      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: commitlint
